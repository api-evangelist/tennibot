name: Tennibot
description: Tennibot builds AI-powered ball machines and autonomous ball collectors
  for tennis, pickleball, and padel. Its flagship Partner ball machine and Rover ball
  collector use computer vision and robotics to deliver realistic drills and eliminate
  manual ball pickup, controlled through the Tennibot mobile app for iOS and Android.
  The company, based in Auburn, Alabama and backed by Techstars, sells direct-to-consumer
  hardware; it ships a companion mobile app but does not publish a public developer
  API, SDK, or documentation. This profile is maintained in the API Evangelist network
  as a company record; no external API surface was found during enrichment.
